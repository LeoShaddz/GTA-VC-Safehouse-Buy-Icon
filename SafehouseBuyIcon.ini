[Main]
; 1 = enabled, 0 = disabled
Enable = 1

; Purchase icon sprite number (25 = "property", the icon used for the game's properties)
Sprite = 25

; 2 = appears only on the radar and map (like properties). 3 = also shows a marker in the world
Display = 2

; 1 = short range: the icon appears on the minimap only when you get close, like weapon shops,
; Ammu-Nation, Pay'n'Spray, etc. (on the full map, it always appears). 0 = always visible on the radar.
ShortRange = 1

; Delay (ms) before creating the icon after the radar is drawn. 0 = immediate (default).
; Only increase this if you notice the purchase icon "flashing" briefly on an already purchased safehouse.
DelayMs = 0

; 1 = generates SafehouseBuyIcon.log next to the .asi (diagnostics)
Log = 0

[Safehouses]
; 1 = shows the purchase icon, 0 = does not show. The names are the game's script keys.
Show_NBMN = 1
Show_LNKV = 1
Show_HYCO = 1
Show_OCHE = 1
Show_WASH = 1
Show_VCPT = 1
Show_SKUM = 1
