[Main]
; 1 = ativo, 0 = desativado
Enable = 1

; Numero do sprite do icone de compra (25 = "property", o icone das propriedades do jogo)
Sprite = 25

; 2 = aparece so no radar e no mapa (como as propriedades). 3 = tambem mostra marcador no mundo
Display = 2

; 1 = curto alcance: o icone aparece no minimapa so quando voce chega perto, igual as lojas
; de armas, Pay'n'Spray etc. (no mapa grande ele aparece sempre). 0 = sempre visivel no radar.
ShortRange = 1

; Espera (ms) antes de criar o icone depois que o radar e desenhado. 0 = imediato (padrao).
; So aumente se notar o icone de compra "piscar" por um instante numa safehouse ja comprada.
DelayMs = 0

; 1 = gera SafehouseBuyIcon.log ao lado do .asi (diagnostico)
Log = 0

[Safehouses]
; 1 = mostra o icone de compra, 0 = nao mostra. Os nomes sao as chaves do script do jogo.
Show_NBMN = 1
Show_LNKV = 1
Show_HYCO = 1
Show_OCHE = 1
Show_WASH = 1
Show_VCPT = 1
Show_SKUM = 1
